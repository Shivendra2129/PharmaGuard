services:
  # ── Python FastAPI Genomics Engine (Single Unified Backend) ─────────────────
  - type: web
    name: pharmaguard-api
    runtime: python
    region: oregon
    plan: free
    rootDir: genomics-service-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PYTHON_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false          # Set to your Vercel URL after deploying frontend (e.g. https://pharmaguard.vercel.app)
